[package]
name = "fnscribe"
version = "0.1.0"
description = "A minimal local macOS push-to-talk dictation utility"
authors = ["arg"]
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.18.1"
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
enigo = { version = "0.6.1", default-features = false }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
