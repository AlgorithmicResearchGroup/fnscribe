[package]
name = "fnscribe"
version = "0.1.0"
description = "A minimal local macOS push-to-talk dictation utility"
authors = ["arg"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.85"

[features]
default = []
delivery-harness = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.18.1"
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSThread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
whisper-rs = { version = "0.16.0", features = ["metal"] }
